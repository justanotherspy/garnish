# width (integer) — Bar width in cells; 0 hides the bar. [minimal=0 default=20 full=30]
# width = 20
# show_icon (bool) — Show the context icon. [minimal=false default=true full=true]
# show_icon = true
# show_percent (bool) — Show the percentage after the bar. [minimal=true default=true full=true]
# show_percent = true
# thresholds (list of numbers) — Ascending percentages where the band color changes. [minimal=[50, 75, 90] default=[50, 75, 90] full=[50, 75, 90]]
# thresholds = [50, 75, 90]
# band_colors (list of colors) — One color per band (roles or literal colors). [minimal=["band1", "band2", "band3", "band4"] default=["band1", "band2", "band3", "band4"] full=["band1", "band2", "band3", "band4"]]
# band_colors = ["band1", "band2", "band3", "band4"]
