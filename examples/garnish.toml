# context — Context window usage bar with color bands and the auto-compaction marker.
[modules.context]
# preset: minimal | default | full; refresh: 0, this module renders every tick
enabled = true
# preset = "default"
refresh = 0
# hide (list of empty | below:N | above:N) — states that hide the module; `empty` is what hide_when_empty hides, and the two combine
hide = []
# label (string ≤ 4096 chars) — Dim text before the value.
label = ""
# prefix (string ≤ 4096 chars) — Text before the module.
prefix = ""
# suffix (string ≤ 4096 chars) — Text after the module.
suffix = ""
# hide_when_empty (bool) — Hide the module when it has nothing to show (else a dim `–`, `-` in the ascii set).
hide_when_empty = true
# max_width (integer ≤ 1024) — Cut the whole module (label, prefix and suffix included) to this many cells with `…`, before alignment and before the line is cut; 0 = unlimited.
max_width = 0
# width (integer ≤ 1024) — Bar width in cells; 0 hides the bar. [minimal=0 default=20 full=30]
# width = 20
# bar (`blocks` | `line`) — Bar glyphs: `blocks` (the icon set's `█`/`░`, fractional cells) or `line` (`━`/`─`, `=`/`-` in the ascii set; whole cells, so no hairline gaps where the font draws `█` narrow). Explicit `icons.fill`/`icons.empty` win. [minimal="blocks" default="blocks" full="blocks"]
# bar = "blocks"
# show_icon (bool) — Show the context icon. [minimal=false default=true full=true]
# show_icon = true
# show_percent (bool) — Show the percentage after the bar. [minimal=true default=true full=true]
# show_percent = true
# thresholds (list of numbers) — Ascending percentages where the band color changes. [minimal=[50, 75, 90] default=[50, 75, 90] full=[50, 75, 90]]
# thresholds = [50, 75, 90]
# band_colors (list of colors) — One color per band (roles or literal colors). [minimal=["band1", "band2", "band3", "band4"] default=["band1", "band2", "band3", "band4"] full=["band1", "band2", "band3", "band4"]]
# band_colors = ["band1", "band2", "band3", "band4"]
# scale (`window` | `usable`) — What 100 % means: `window` the whole context window; `usable` the auto-compaction threshold, so the bar and the percentage say how close compaction is (the marker and its percentage are then implied and not drawn; the window tag still names the real window). `usable` falls back to `window` when compaction is disabled or the threshold is under a tenth of the window. [minimal="window" default="window" full="window"]
# scale = "window"
# compaction_marker (bool) — Mark the auto-compaction threshold on the bar. [minimal=true default=true full=true]
# compaction_marker = true
# compact_buffer_tokens (integer) — Tokens Claude Code reserves below the window for the compaction summary. [minimal=13000 default=13000 full=13000]
# compact_buffer_tokens = 13000
# show_compaction_percent (bool) — Also print the compaction threshold as a percentage. [minimal=false default=false full=true]
# show_compaction_percent = false
# show_window (bool) — Show the window size tag (`1M`, `200k`). [minimal=false default=false full=true]
# show_window = false
# exceeds_200k (bool) — Show an indicator when the last response exceeded 200k tokens. [minimal=false default=false full=true]
# exceeds_200k = false
# warn_at (number) — Extra warning badge at or above this percentage; 0 disables. [minimal=0 default=0 full=0]
# warn_at = 0
# tokens (`inherit` | `compact` | `precise` | `whole`) — How this module's token counts print: `inherit` follows `[format] tokens`; `compact` (128k, 1.0M), `precise` (128,400) or `whole` (128400) pins this module. [minimal="inherit" default="inherit" full="inherit"]
# tokens = "inherit"
# percent (`inherit` | `whole` | `precise`) — How this module's percentages print: `inherit` follows `[format] percent`; `whole` (42%) or `precise` (42.3%) pins this module. [minimal="inherit" default="inherit" full="inherit"]
# percent = "inherit"
[modules.context.icons]
# Any key also accepts <key>_frames = [...]: equal-width glyphs cycled one per tick.
# context — Context icon.
context = ""
# fill — Filled bar cell.
fill = "█"
# empty — Empty bar cell.
empty = "░"
# marker — Compaction marker.
marker = "▏"
# compact — Compaction label glyph.
compact = "⤓"
# exceeds — Exceeds-200k indicator.
exceeds = "‼"
# warn — Warning badge.
warn = ""
[modules.context.colors]
# icon — Icon.
icon = "accent"
# percent — Percentage text (the band colour is the bar's).
percent = "text"
# empty — Empty part of the bar.
empty = "muted"
# marker — Compaction marker.
marker = "warn"
# exceeds — Exceeds-200k indicator.
exceeds = "danger"
# window — Window size tag.
window = "muted"
# warn — Warning badge.
warn = "danger"

