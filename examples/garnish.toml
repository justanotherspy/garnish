# garnish configuration — see docs/config.md for every key.
# Top-level preset: default | minimal | full | compact
preset = "default"
# Icon set: nerd | unicode | emoji | ascii
icons = "nerd"
# Theme: garnish | catppuccin-mocha | nord | dracula | tokyonight | mono
theme = "garnish"
# Color output: auto | always | never | 256 | truecolor
color = "auto"
# Truncate the left group when a line overflows the width.
truncate = true
# Stale cached values: dim | hide | plain
stale_style = "dim"
# TTL periods a cached value may be overdue before it is styled stale (>= 1).
stale_after = 5
# Extra cells subtracted from the width, on top of the 4 Claude Code's box
# always takes; set 2 x statusLine.padding when that setting is non-zero.
padding = 0
# Pad each module column to the widest module in it across lines, so the
# separators line up vertically.
align = false
# Where a padded right-group module's text sits: end (hugs the cap) | start (follows the separator)
right_justify = "end"
# Drop a row whose modules all rendered nothing (a `modules = []` spacer is kept).
hide_empty_rows = true
# A left group wider than its budget: truncate (cut with …) | ticker (scroll it)
overflow = "truncate"
# Ticker: cells scrolled per tick (0.5 = every second tick) and the text between end and start
ticker_step = 1
ticker_gap = "   "
# Master switch for every animation (spinner, scrolling text, rule pattern, separator and icon frames); false freezes them at frame 0 and cuts a ticker line with …
# Unset, animations follow Claude Code's prefersReducedMotion setting; GARNISH_ANIMATE=0 freezes a session either way
# animate = true
# Elapsed times and countdowns: compact (8m20s, 9m, 2h) | fixed (8m20s, 9m00s, 2h00m); unset, it is fixed under overflow = "ticker" and compact otherwise, and each timer module can pin its own
# durations = "compact"

# Number formats (docs/config.md § [format]): each module that prints a kind has the same key with `inherit`.
[format]
# Token counts: compact (128k, 1.0M) | precise (128,400) | whole (128400)
tokens = "compact"
# Percentages: whole (42%) | precise (42.3%)
percent = "whole"
# Money: precise ($1.23, cost.decimals places) | whole ($1)
cost = "precise"
# Parenthesised details (api's share, lines' net, a `both` reset): plain | dim (the muted role)
parens = "plain"

# Role color overrides; every module color defaults to one of these roles.
[colors]
# accent = "#7dd3a0"
# accent2 = "#89b4fa"
# muted = "#6c7086"
# text = "#cdd6f4"
# ok = "#a6e3a1"
# warn = "#f9e2af"
# hot = "#fab387"
# danger = "#f38ba8"
# frame = "#585b70"
# band1 = "#a6e3a1"
# band2 = "#f9e2af"
# band3 = "#fab387"
# band4 = "#f38ba8"

# Frame style: none | rounded | square | double | heavy | powerline | custom
[frame]
style = "rounded"
# Extend the rule to the full width and close with the right cap.
fill = true
# Default separator between modules on a line (style-dependent when unset).
# separator = " │ "
# Every separator's colour: muted | inherit (the colour of the module before it) | a role or literal
separator_color = "muted"
# For style = "custom": first middle last single fill_char right_first right_middle right_last right_single pad, and the box glyphs top_left top_right bottom_left bottom_right side
# Animation (see docs/config.md): a one-cell-glyph pattern travelling along the rule,
# and separator frames cycled one per tick (all the same width). Empty = static.
fill_pattern = ""
fill_step = 1
fill_direction = "right"
separator_frames = []
separator_step = 1

# Rows: `modules` are left-aligned, `right` are right-aligned. Any module may go anywhere.
# A row can hold columns side by side instead; see docs/config.md § [[row.col]]:
# [[row]]
# gap = 2
# [[row.col]]
# width = "1fr"        # "<n>fr" | "auto" | a cell count
# modules = ["path", "branch"]
[[row]]
modules = ["path", "branch", "sync", "worktree", "pr"]
right = ["session_name", "agent"]
[[row]]
modules = ["model", "effort", "context", "style"]
right = ["vim"]
[[row]]
modules = ["limit5h", "limit7d", "spend", "cost"]
right = ["lines"]
[[row]]
modules = ["session", "api", "cache"]
right = ["clock"]

# A box frames a run of adjacent rows, or a whole column:
# [box.repo]
# title = "Repository"
# title_justify = "left"  # left | center | right
# style = "double"        # inherits [frame] style when absent
# fill = false            # draw the rule inside the box too
# color = "accent"        # role or literal; frame colour when absent

# path — Working directory, based on the repository root.
[modules.path]
# preset: minimal | default | full; refresh: 0, this module renders every tick
enabled = true
# preset = "default"
refresh = 0
# hide (list of empty) — states that hide the module; `empty` is what hide_when_empty hides, and the two combine
hide = []
# label (string ≤ 4096 chars) — Dim text before the value.
label = ""
# prefix (string ≤ 4096 chars) — Text before the module.
prefix = ""
# suffix (string ≤ 4096 chars) — Text after the module.
suffix = ""
# hide_when_empty (bool) — Hide the module when it has nothing to show (else a dim `–`, `-` in the ascii set).
hide_when_empty = true
# max_width (integer ≤ 1024) — Cut the whole module (label, prefix and suffix included) to this many cells with `…`, before alignment and before the line is cut; 0 = unlimited.
max_width = 0
# show_icon (bool) — Show the folder icon. [minimal=false default=true full=true]
# show_icon = true
# depth (integer) — Path components of the base to keep (0 = all). [minimal=1 default=2 full=0]
# depth = 2
# style (`full` | `fish`) — How the base prints: `full` as is; `fish` abbreviates every directory but the last to its first character (`~/p/garnish`; a dot-directory to `.c`), as the fish shell prompts. `depth` applies first; the subpath is untouched. [minimal="full" default="full" full="full"]
# style = "full"
# show_subpath (bool) — Show the path below the base. [minimal=false default=true full=true]
# show_subpath = true
# show_added (bool) — Show the count of added directories. [minimal=false default=false full=true]
# show_added = false
[modules.path.icons]
# Any key also accepts <key>_frames = [...]: equal-width glyphs cycled one per tick.
# folder — Folder icon.
folder = ""
# added — Added-directories glyph.
added = ""
[modules.path.colors]
# icon — Icon.
icon = "accent"
# base — Base directory.
base = "text"
# subpath — Path below the base.
subpath = "muted"
# added — Added directories.
added = "muted"

# branch — Checked-out branch (or detached HEAD).
[modules.branch]
# preset: minimal | default | full; refresh: seconds a cached value lives before a worker refreshes it (at least 1)
enabled = true
# preset = "default"
refresh = 5
# hide (list of empty) — states that hide the module; `empty` is what hide_when_empty hides, and the two combine
hide = []
# label (string ≤ 4096 chars) — Dim text before the value.
label = ""
# prefix (string ≤ 4096 chars) — Text before the module.
prefix = ""
# suffix (string ≤ 4096 chars) — Text after the module.
suffix = ""
# hide_when_empty (bool) — Hide the module when it has nothing to show (else a dim `–`, `-` in the ascii set).
hide_when_empty = true
# max_width (integer ≤ 1024) — Cut the whole module (label, prefix and suffix included) to this many cells with `…`, before alignment and before the line is cut; 0 = unlimited.
max_width = 0
# show_icon (bool) — Show the branch icon. [minimal=false default=true full=true]
# show_icon = true
# show_sha (bool) — Append the short commit SHA. [minimal=false default=false full=true]
# show_sha = false
# dirty (bool) — Show a marker when tracked files have staged or unstaged changes (untracked files do not count; a file touched without changing counts until git next refreshes its index, since garnish never reads file contents). [minimal=false default=false full=true]
# dirty = false
# max_length (integer) — Cut the name itself to this many characters with `…` (`..` in the ascii set; 0 = no limit); the common `max_width` caps the whole module in cells instead. [minimal=40 default=40 full=40]
# max_length = 40
# link (bool) — Link the name to the branch on the forge (`https://<host>/<owner>/<name>/tree/<branch>`, `/-/tree/` on GitLab), built from `workspace.repo` in the payload; nothing is linked without it or on a detached HEAD. GitLab is recognised by a host named after it or an open merge request, so a self-hosted GitLab on an unrelated host name links to `/tree/` until one is open. [minimal=false default=false full=false]
# link = false
[modules.branch.icons]
# Any key also accepts <key>_frames = [...]: equal-width glyphs cycled one per tick.
# branch — Branch icon.
branch = ""
# detached — Detached HEAD icon.
detached = ""
# dirty — Dirty marker.
dirty = ""
[modules.branch.colors]
# icon — Icon.
icon = "accent"
# name — Branch name.
name = "text"
# sha — Short SHA.
sha = "muted"
# dirty — Dirty marker.
dirty = "warn"

# sync — Commits ahead/behind the upstream branch.
[modules.sync]
# preset: minimal | default | full; refresh: seconds a cached value lives before a worker refreshes it (at least 1)
enabled = true
# preset = "default"
refresh = 5
# hide (list of empty | zero) — states that hide the module; `empty` is what hide_when_empty hides, and the two combine
hide = []
# label (string ≤ 4096 chars) — Dim text before the value.
label = ""
# prefix (string ≤ 4096 chars) — Text before the module.
prefix = ""
# suffix (string ≤ 4096 chars) — Text after the module.
suffix = ""
# hide_when_empty (bool) — Hide the module when it has nothing to show (else a dim `–`, `-` in the ascii set).
hide_when_empty = true
# max_width (integer ≤ 1024) — Cut the whole module (label, prefix and suffix included) to this many cells with `…`, before alignment and before the line is cut; 0 = unlimited.
max_width = 0
# show_zero (bool) — Show `0` counts instead of hiding them. [minimal=false default=false full=false]
# show_zero = false
# show_upstream (bool) — Show the upstream name. [minimal=false default=false full=true]
# show_upstream = false
# fetch_age (bool) — Hint when the last fetch is older than `fetch_stale_minutes`. [minimal=false default=true full=true]
# fetch_age = true
# fetch_stale_minutes (integer) — Age after which the fetch hint appears. [minimal=30 default=30 full=30]
# fetch_stale_minutes = 30
# fetch_interval (integer) — Run `git fetch` in the background every N seconds (0 = never). [minimal=0 default=0 full=0]
# fetch_interval = 0
# durations (`inherit` | `compact` | `fixed`) — How this module's timers and countdowns print: `inherit` follows the top-level `durations`; `compact` or `fixed` pins this module. [minimal="inherit" default="inherit" full="inherit"]
# durations = "inherit"
[modules.sync.icons]
# Any key also accepts <key>_frames = [...]: equal-width glyphs cycled one per tick.
# ahead — Ahead glyph.
ahead = "⇡"
# behind — Behind glyph.
behind = "⇣"
# stale — Stale-fetch glyph.
stale = ""
# no_upstream — No-upstream glyph.
no_upstream = ""
[modules.sync.colors]
# ahead — Ahead count.
ahead = "ok"
# behind — Behind count.
behind = "warn"
# upstream — Upstream name.
upstream = "muted"
# stale — Fetch-age hint.
stale = "muted"

