# utc_offset (bool) — Show the UTC offset. [minimal=false default=false full=true]
# utc_offset = false
# tz (string) — IANA time zone; empty means the system zone. [minimal="" default="" full=""]
# tz = ""
[modules.clock.icons]
# spinner — Spinner frames, one character each.
spinner = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
[modules.clock.colors]
# spinner — Spinner.
spinner = "accent"
# time — Time.
time = "text"
# date — Date and offset.
date = "muted"

# session_name — Session name.
[modules.session_name]
# preset: minimal | default | full; refresh: seconds between refreshes (0 = every tick)
enabled = true
# preset = "default"
refresh = 0
# label: text before the value; prefix/suffix: text around the module
label = ""
prefix = ""
suffix = ""
# hide_when_empty: hide the module entirely when it has nothing to show (else a dim –)
hide_when_empty = true
# show_icon (bool) — Show the icon. [minimal=false default=true full=true]
# show_icon = true
# show_id (bool) — Append the first 8 characters of the session id. [minimal=false default=false full=true]
# show_id = false
# max_length (integer) — Truncate longer names (0 = no limit). [minimal=32 default=32 full=32]
# max_length = 32
[modules.session_name.icons]
# name — Name icon.
name = ""
[modules.session_name.colors]
# icon — Icon.
icon = "accent2"
# name — Name.
name = "text"
# id — Session id.
id = "muted"

