# width = 0  # Box width in cells; 0 = the text's own width.
# pad = 0  # Blank cells added on each side of the box.
# justify = "left"  # Where text narrower than the box sits.
# overflow = "scroll"  # Text wider than the box: `clip` cuts with an ellipsis, `scroll` slides a window and restarts after the end, `scroll-wrap` flows continuously with `gap` between end and start.
# step = 1  # Cells scrolled per tick (0.001–1000; 0.5 = every second tick).
# gap = "   "  # `scroll-wrap` only: text between the end and the start.
