# ahead — Ahead glyph.
ahead = "⇡"
# behind — Behind glyph.
behind = "⇣"
# stale — Stale-fetch glyph.
stale = ""
# no_upstream — No-upstream glyph.
no_upstream = ""
[modules.sync.colors]
# ahead — Ahead count.
ahead = "ok"
# behind — Behind count.
behind = "warn"
# upstream — Upstream name.
upstream = "muted"
# stale — Fetch-age hint.
stale = "muted"

