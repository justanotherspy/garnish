# garnish configuration — see docs/config.md for every key.
# Top-level preset: default | minimal | full | compact
preset = "default"
# Icon set: nerd | unicode | emoji | ascii
icons = "nerd"
# Theme: garnish | catppuccin-mocha | nord | dracula | tokyonight | mono
theme = "garnish"
# Color output: auto | always | never | 256 | truecolor
color = "auto"
# Truncate the left group when a line overflows the width.
truncate = true
# Stale cached values: dim | hide | plain
stale_style = "dim"
# TTL periods a cached value may be overdue before it is styled stale (>= 1).
stale_after = 5
# Extra cells subtracted from the width, on top of the 4 Claude Code's box
# always takes; set 2 x statusLine.padding when that setting is non-zero.
padding = 0
# Pad each module column to the widest module in it across lines, so the
# separators line up vertically.
align = false
# Elapsed times and countdowns: compact (8m20s, 9m, 2h) | fixed (8m20s, 9m00s, 2h00m)
durations = "compact"

# Role color overrides; every module color defaults to one of these roles.
[colors]
# accent = "#7dd3a0"
# accent2 = "#89b4fa"
# muted = "#6c7086"
# text = "#cdd6f4"
# ok = "#a6e3a1"
# warn = "#f9e2af"
# hot = "#fab387"
# danger = "#f38ba8"
# frame = "#585b70"
# band1 = "#a6e3a1"
# band2 = "#f9e2af"
# band3 = "#fab387"
# band4 = "#f38ba8"

# Frame style: none | rounded | square | double | heavy | powerline | custom
[frame]
style = "rounded"
# Extend the rule to the full width and close with the right cap.
fill = true
# Default separator between modules on a line (style-dependent when unset).
# separator = " │ "
# For style = "custom": first middle last single fill_char right_first right_middle right_last right_single pad

# Lines: `modules` are left-aligned, `right` are right-aligned. Any module may go anywhere.
[[line]]
modules = ["path", "branch", "sync", "worktree", "pr"]
right = ["session_name", "agent"]
[[line]]
modules = ["model", "effort", "context", "style"]
right = ["vim"]
[[line]]
modules = ["limit5h", "limit7d", "spend", "cost"]
right = ["lines"]
[[line]]
modules = ["session", "api", "cache"]
right = ["clock"]

# path — Working directory, based on the repository root.
[modules.path]
# preset: minimal | default | full; refresh: seconds between refreshes (0 = every tick)
enabled = true
# preset = "default"
refresh = 0
# label: text before the value; prefix/suffix: text around the module
label = ""
prefix = ""
suffix = ""
# hide_when_empty: hide the module entirely when it has nothing to show (else a dim –)
hide_when_empty = true
# show_icon (bool) — Show the folder icon. [minimal=false default=true full=true]
# show_icon = true
# depth (integer) — Path components of the base to keep (0 = all). [minimal=1 default=2 full=0]
# depth = 2
# show_subpath (bool) — Show the path below the base. [minimal=false default=true full=true]
# show_subpath = true
# show_added (bool) — Show the count of added directories. [minimal=false default=false full=true]
# show_added = false
[modules.path.icons]
# folder — Folder icon.
folder = ""
# added — Added-directories glyph.
added = ""
[modules.path.colors]
# icon — Icon.
icon = "accent"
# base — Base directory.
base = "text"
# subpath — Path below the base.
subpath = "muted"
# added — Added directories.
added = "muted"

# branch — Checked-out branch (or detached HEAD).
[modules.branch]
# preset: minimal | default | full; refresh: seconds between refreshes (0 = every tick)
enabled = true
# preset = "default"
refresh = 5
# label: text before the value; prefix/suffix: text around the module
label = ""
prefix = ""
suffix = ""
# hide_when_empty: hide the module entirely when it has nothing to show (else a dim –)
hide_when_empty = true
# show_icon (bool) — Show the branch icon. [minimal=false default=true full=true]
# show_icon = true
# show_sha (bool) — Append the short commit SHA. [minimal=false default=false full=true]
# show_sha = false
# dirty (bool) — Show a marker when the tree has changes. [minimal=false default=false full=true]
# dirty = false
# max_length (integer) — Truncate longer names (0 = no limit). [minimal=40 default=40 full=40]
# max_length = 40
[modules.branch.icons]
# branch — Branch icon.
branch = ""
# detached — Detached HEAD icon.
detached = ""
# dirty — Dirty marker.
dirty = "●"
[modules.branch.colors]
# icon — Icon.
icon = "accent"
# name — Branch name.
name = "text"
# sha — Short SHA.
sha = "muted"
# dirty — Dirty marker.
dirty = "warn"

# sync — Commits ahead/behind the upstream branch.
[modules.sync]
# preset: minimal | default | full; refresh: seconds between refreshes (0 = every tick)
enabled = true
# preset = "default"
refresh = 5
# label: text before the value; prefix/suffix: text around the module
label = ""
prefix = ""
suffix = ""
# hide_when_empty: hide the module entirely when it has nothing to show (else a dim –)
hide_when_empty = true
# show_zero (bool) — Show `0` counts instead of hiding them. [minimal=false default=false full=false]
# show_zero = false
# show_upstream (bool) — Show the upstream name. [minimal=false default=false full=true]
# show_upstream = false
# fetch_age (bool) — Hint when the last fetch is older than `fetch_stale_minutes`. [minimal=false default=true full=true]
# fetch_age = true
# fetch_stale_minutes (integer) — Age after which the fetch hint appears. [minimal=30 default=30 full=30]
# fetch_stale_minutes = 30
# fetch_interval (integer) — Run `git fetch` in the background every N seconds (0 = never). [minimal=0 default=0 full=0]
# fetch_interval = 0
