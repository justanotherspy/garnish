name: Claude Review

# An on-demand code review by Claude. It authenticates to the Claude API by
# exchanging this workflow's GitHub OIDC token for a short-lived access token
# (workload identity federation), so there is no ANTHROPIC_API_KEY secret.
#
# A review costs real money, so it is always asked for and never automatic. It
# runs only when every one of these holds:
#
#   - the pull request was opened by justanotherspy;
#   - the pull request is open and NOT a draft;
#   - somebody wrote @claude in a comment or a review, or the `claude-review`
#     label was added.
#
# Note there is deliberately no `synchronize` trigger: pushing to a branch does
# not re-run the review. Ask for it again with @claude.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

# Every action is pinned to a full commit SHA (Renovate keeps the pins and the
# version comments current).
jobs:
  review:
    # The cheap gates, on payload fields that are present for every one of the
    # four events above, so an unwanted trigger never starts a runner. The
    # draft and open checks live in the guard step below, because the
    # `issue_comment` payload describes the pull request as an *issue* and the
    # shape of that object is not worth betting the gate on.
    #
    # Bot authors are excluded because this review talks on the very events it
    # listens to: `track_progress` posts a tracking comment and the review
    # posts its summary through `gh pr comment`, both as `claude[bot]`, and
    # both arrive back here as `issue_comment: created`.
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.user.login == 'justanotherspy' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.user.login == 'justanotherspy' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.user.login == 'justanotherspy' &&
        github.event.review.user.type != 'Bot' &&
        contains(github.event.review.body, '@claude')
      ) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'justanotherspy' &&
        github.event.label.name == 'claude-review'
      )
    # One review per pull request at a time: a newer request cancels one that
    # is still running rather than paying for both.
    #
    # This MUST stay on the job and never move up to the workflow. A
    # workflow-level group is claimed when the run is *created*, before any
    # job `if` is evaluated, so a run that goes on to skip every job still
    # evicts the run holding the group. That is not hypothetical: it killed
    # the first real review 80 seconds in (run 34878106655), because the
    # tracking comment the review had just posted created a second run that
    # claimed the group and was then skipped. On the job, a skipped job never
    # joins the group.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # Required: fetches the GitHub OIDC token for the federation exchange
      actions: read # Required for Claude to read CI results on the pull request
    steps:
      # Authoritative draft/open check against live state: a pull request can
      # be converted back to a draft after the comment that triggered this, and
      # the webhook payload is a snapshot from before that.
      - name: Check the pull request is open and not a draft
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft \
            --jq '"\(.state) \(.isDraft)"')
          echo "pull request #$PR is: $state"
          if [ "$state" = "OPEN false" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: a review runs only on an open, ready-for-review pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The pull request's own head, named explicitly. Three of the four
      # triggers are comment events, whose `GITHUB_REF` is the default
      # branch, not the pull request, so without a `ref:` the review reads
      # `main`'s tree while reasoning about the pull request's diff, which
      # is exactly what the prompt below assumes away ("The PR branch is
      # already checked out"). The `labeled` trigger is a `pull_request`
      # event and was unaffected, which is why this went unnoticed.
      - name: Checkout repository
        if: steps.gate.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        #
        # Full history, not a shallow head. At depth 1 there is no merge base
        # with the base branch, so `git diff main...HEAD` and `git log
        # main..HEAD` - the commands the allowlist and the prompt both point
        # the review at - cannot resolve, and it is left with `gh pr diff`
        # alone. This repository is 52 commits and under 5 MB, so the whole
        # history costs nothing.
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          fetch-depth: 0

      # The diff, handed to the review as a file rather than left for it to
      # fetch. Five runs in a row died trying to get or slice it through
      # `Bash`, the last one on `git diff … | wc -l` with *both* `Bash(git:*)`
      # and `Bash(wc:*)` allowed (run 35453133607), which is the run that
      # settled it: a compound command is refused here whatever its parts are
      # allowed to do, so no allowlist can buy the review a pipeline. `Read`
      # needs no allowlist entry at all, and this step is plain job shell with
      # no permission system in front of it.
      - name: Collect the diff for the review
        id: diff
        if: steps.gate.outputs.review == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          base="$(git merge-base FETCH_HEAD HEAD)"
          git diff --stat "$base" HEAD > "$RUNNER_TEMP/pr.diffstat"
          git diff "$base" HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Collected $(wc -l < "$RUNNER_TEMP/pr.diff") lines of diff against $BASE_BRANCH ($base)."

      - name: Review
        id: review
        if: steps.gate.outputs.review == 'true'
        uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227
        with:
          # These values are identifiers, not secrets. The federation rule is
          # what restricts which OIDC subject may exchange for a token.
          anthropic_federation_rule_id: fdrl_01Sf3P3B65XKxK66EWBeNrxh
          anthropic_organization_id: c419af23-49f3-48ec-b346-a345f64ee5ec
          anthropic_service_account_id: svac_01So6woBVPFG4GmNRJT2QKVz
          # Required here because the federation rule spans every workspace;
          # without it the exchange returns 400 workspace_id_required.
          anthropic_workspace_id: wrkspc_01FrtuNtJAYdwk63f9DRj7UY

          # Forces tag mode with a tracking comment on the `labeled` event.
          # The three comment events already run in tag mode, where the
          # tracking comment is the default, so this changes nothing for them.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in
            the working directory.

            **The diff is already collected for you. Do not fetch it.**

            - `${{ runner.temp }}/pr.diffstat` - the per-file summary. Read
              this first; it is small and it tells you where to look.
            - `${{ runner.temp }}/pr.diff` - the full diff against the merge
              base. `Read` it in slices, or `Grep` it, rather than in one go.

            `Read` and `Grep` need no permission and cannot be refused. Use
            them for the diff and for the tree. `git` is available if you want
            history a diff cannot show, but you should not need it to see what
            changed.

            Read `CLAUDE.md` first, and `SPEC.md` when the change touches
            behaviour rather than only internals. They are the project's own
            rules, and they are the standard to review against: prefer a
            finding that cites a rule in those files over a generic one.

            Cover all of:

            1. **Correctness** - logic errors, wrong edge-case handling, broken
               invariants. Read the cache/worker invariants in `CLAUDE.md`
               before judging anything under `src/` that touches a cache entry,
               a lock file or a spawned worker.
            2. **Panic safety and the lint policy** - this crate denies
               `unwrap_used`, `expect_used`, `indexing_slicing`,
               `arithmetic_side_effects`, `as_conversions`, `panic` and friends
               outside `#[cfg(test)]`. Flag any new panic path, bare index,
               `as` cast, or unchecked arithmetic in non-test code, and any
               `#[allow(...)]` added without a one-line justification.
            3. **Security** - untrusted input reaching a path, a command, or a
               rendered row; anything that could put an escape sequence on the
               status line; secrets or tokens in logs or committed files.
            4. **Performance** - the warm-tick budget is mean < 3 ms and
               p99 < 8 ms. Flag work added to the render path, especially
               allocation in a loop, a settings read outside `Ctx::settings()`,
               or a child process on a warm tick.
            5. **Tests** - is each behaviour change covered? Bugs need a unit
               test, and user-visible behaviour needs an integration or golden
               test. Flag a test that was weakened or removed.
            6. **Documentation and generated files** - a schema change must
               carry regenerated `docs/`, `examples/` and `tests/golden/`.
               `README.md` changes when anything a user needs changes;
               `SPEC.md` and `PLAN.md` change when the target design does.

            Check the CI status for this pull request and factor a failure into
            the review rather than repeating what CI already says.

            Post specific issues as inline comments on the lines they concern,
            and one top-level comment summarising the review. Say which
            findings are blocking and which are nits. Do not post a comment
            that only offers praise.

            **Write tersely.** Lead each comment with the finding in one
            sentence, then only the evidence needed to act on it. No preamble,
            no restating the diff, no narrating what you are about to say, no
            recap of your own reasoning. Prefer a short code block or a
            ```suggestion``` block over prose describing a change. Aim for
            under 120 words per inline comment; go longer only when a subtle
            correctness argument genuinely needs it. The summary is a short
            list, one line per finding, blocking ones first. A reviewer should
            be able to read the whole review in a minute.

            **Prefer to review it yourself.** Your context window holds a
            diff this size several times over, and every run that has failed
            here failed with subagents outstanding: the parent stopped while
            they were still going and posted nothing. You may fan out, but
            treat it as a cost, not a default, and never end your own run
            while a subagent is unfinished - wait for it, or drop it and
            write the summary from what you have. Give each a narrow brief,
            tell it the tool rules below, and have it report back to you; you
            post, since a subagent cannot.

            You have a turn budget, and every inline comment, every progress
            update and every subagent spends from it. The summary comment is
            the most useful thing you produce, so protect it: as the budget
            runs low, fold your remaining findings into the summary rather
            than posting them one by one. Run short on inline comments, never
            on the summary. **Never end without posting the summary** - a run
            that finishes having posted nothing has wasted everything it
            spent, whatever its checklist says.

            Keep the review to the diff and the code it touches. Do NOT run
            `cargo build`, `cargo test`, `cargo clippy` or `make check` - CI
            already runs all of those, and a toolchain build here costs
            several minutes for nothing.

            **Your tools are an allowlist, and a denied call still costs a
            turn.** You have `Read`, `Grep`, `Glob`, `LS` and `TodoWrite`;
            `git`, in full, so fetch the base branch yourself if
            `main...HEAD` does not resolve; and `Bash` for `gh pr diff|view`,
            `rg`, `grep`, `cat`, `sed`, `awk`, `sort`, `uniq`, `cut`, `jq`,
            `wc`, `head`, `tail`, `ls`, `find` - plus the two that post
            (`gh pr comment`, the inline-comment tool). Anything else is
            refused.

            **A compound command is refused even when each part of it is
            allowed.** `git diff … | wc -l` was refused with both `git` and
            `wc` on this list. So no pipe, no `&&`, no `;`, no `$(…)` - one
            command per call, always. When you want less output, ask for less
            of it (`--stat`, `-- <path>`) rather than piping it through
            something. Reach for `Read` and `Grep` first; if a call is
            denied, do not retry it and do not look for another way around it
            - use the tools you have, and say in the summary what you could
            not check. The same allowlist binds every subagent, so tell each
            one this too. A run that spends its turns on refusals and posts
            nothing is the worst outcome there is.

          # `claude_args` is a block scalar: every line is passed to the CLI
          # verbatim, so a `#` line here would become an argument, not a
          # comment. Keep notes above this key.
          #
          # --max-turns: 15 was not enough. The first real review
          # (run 34879256227) died on error_max_turns three seconds after its
          # second inline comment, with the summary still unwritten.
          # `track_progress` is part of that cost, since each checklist update
          # is a turn, and so is each inline comment. 50 was not enough
          # either, for a different reason: see Task below. 100 is the cap
          # now, because a truncated review wastes everything it has spent
          # and a fanned-out one spends turns faster.
          #
          # Task: the review fans out. Without it, a review of a 51-file diff
          # delegated four of its six dimensions, had all four refused, and
          # posted nothing at all - no summary, no inline comments - while
          # still reporting success after 44 turns and $2.43 (PR #66). A
          # subagent's turns come out of this same budget, which is the other
          # half of why the cap doubled.
          #
          # The read-only Bash entries are the second half of that same
          # lesson. With `Task` allowed but nothing else to run, the review of
          # PR #69 fanned out to three subagents and died of refusals instead:
          # `permission_denials_count: 12` against `num_turns: 11`, ending
          # `"subtype": "success"` after 76 seconds and $0.89 with three of six
          # checklist boxes still "subagent running" and no summary. A
          # subagent inherits this allowlist, so a review it cannot run `git
          # diff` or `rg` in spends its budget being told no. These entries
          # are read-only by intent, not by enforcement - a shell can redirect
          # whatever it likes - which is acceptable because the checkout is
          # thrown away and the action already allows `git add|commit` and its
          # own push script. The prompt above tells the review the same thing,
          # because the allowlist alone only refuses; it does not explain.
          #
          # The third silent run (run 35451305473) is why the list below grew
          # again, and why the step after this one exists. The allowlist from
          # the round before it *did* apply - the job log's "SDK options" shows
          # `Task` and every read-only `Bash` entry present - and the review
          # still ended `"subtype": "success"` after 10 turns and $0.95 with
          # `permission_denials_count: 10`, no summary and no inline comments.
          # Ten turns, ten refusals.
          #
          # That step then reported, on the very next run (35452476655), what
          # four rounds of inference had not: every one of the twelve denials
          # was a `git` call, and nothing else. Not `TodoWrite`, not the text
          # tools - those guesses were simply wrong.
          #
          #     5  Bash(git:*)
          #     4  Bash(git diff:*)
          #     3  Bash(git fetch origin:*)
          #
          # The middle line is the one that matters: `Bash(git diff:*)` was in
          # the allowlist already and was refused anyway, so those calls died
          # on their *shape* rather than their verb - a flag before the
          # subcommand (`git --no-pager diff`, `git -C . diff`), which is also
          # what the `Bash(git:*)` group is, or a pipe into something the list
          # does not carry. An allowlist of git subcommands cannot express
          # that, because it matches on a prefix and git's flags may precede
          # the verb.
          #
          # So git is allowed whole. What that actually widens is small: the
          # job holds `contents: read`, so a push cannot succeed, and the only
          # tree a write could touch is a checkout thrown away when the runner
          # goes. The action's own defaults already hand the review
          # `git add`, `git commit`, `git rm` and its push script, so git
          # writes were never outside the surface to begin with.
          #
          # --model / --effort: Sonnet 5 at high effort. Sonnet is ~2.5x
          # cheaper per token than Opus 5 ($2/$10 vs $5/$25 per MTok), which
          # is what pays for the ceiling: 16 Opus turns cost $0.95, so even
          # 100 Sonnet turns stay in the same range.
          claude_args: |
            --model claude-sonnet-5
            --effort high
            --max-turns 100
            --allowedTools "Task,TodoWrite,mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git:*),Bash(rg:*),Bash(grep:*),Bash(cat:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(jq:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(find:*)"

      # The action's own conclusion is not a verdict on the review: it reports
      # success whenever Claude returned a result, so three runs in a row went
      # green having posted nothing at all. This reads the execution file the
      # action writes - the full transcript, kept on disk whatever
      # `show_full_output` says - and turns the two silent failures into a red
      # check with the reason in the job summary: a refused call, named, and a
      # run that never posted its summary.
      #
      # It runs the *base branch's* copy of the script, not the checkout's.
      # The checkout is the pull request's head, which the action treats as
      # untrusted for exactly this reason (it restores `CLAUDE.md`, `.claude`
      # and the rest from the base before letting Claude near them), and this
      # step holds the job's token. The gate above already limits the workflow
      # to Daniel's own pull requests, so this is defence in depth rather than
      # the only thing standing there.
      - name: Report what the review was refused
        if: always() && steps.gate.outputs.review == 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/review-denials.sh"
          git fetch --depth 1 origin "$BASE_BRANCH"
          if ! git show "FETCH_HEAD:scripts/review-denials.sh" > "$script"; then
            echo "No scripts/review-denials.sh on $BASE_BRANCH yet; nothing to report." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          chmod +x "$script"
          "$script" "${EXECUTION_FILE:-}" | tee -a "$GITHUB_STEP_SUMMARY"
