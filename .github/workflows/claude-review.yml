name: Claude Review

# An on-demand code review by Claude, authenticated by exchanging this
# workflow's GitHub OIDC token for a short-lived Claude token (workload
# identity federation; no API key secret). A review costs money, so it never
# runs on a push: it runs when every one of these holds:
#
#   - the pull request was opened by justanotherspy;
#   - it is open and not a draft (checked against live state below);
#   - somebody wrote @claude in a comment or a review, or added the
#     `claude-review` label.
#
# The job collects everything the review needs (the pull request, its diff,
# its CI state) into files with plain job shell, then hands the action a short
# prompt that points at them. CLAUDE.md § Claude review has the history of
# why it is shaped this way.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

# Every action is pinned to a full commit SHA (Renovate keeps the pins and the
# version comments current).
jobs:
  review:
    # Bot authors are excluded because the review talks on the events it
    # listens to: its tracking comment and its summary come back here as
    # `issue_comment: created`.
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.user.login == 'justanotherspy' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.user.login == 'justanotherspy' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.user.login == 'justanotherspy' &&
        github.event.review.user.type != 'Bot' &&
        contains(github.event.review.body, '@claude')
      ) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'justanotherspy' &&
        github.event.label.name == 'claude-review'
      )
    # One review per pull request at a time. The group stays on the job: a
    # workflow-level group is claimed before any `if` runs, so a run that
    # then skips every job would still cancel the review in progress.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # the OIDC token for the federation exchange
      actions: read # CI results on the pull request
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Live state, because a pull request can be converted to a draft after
      # the comment that triggered this, and the payload predates that.
      - name: Check the pull request is open and not a draft
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft \
            --jq '"\(.state) \(.isDraft)"')
          echo "pull request #$PR is: $state"
          if [ "$state" = "OPEN false" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: a review runs only on an open, ready-for-review pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The pull request's head, named explicitly: three of the four triggers
      # are comment events whose GITHUB_REF is the default branch. Full
      # history, so the merge base resolves.
      - name: Checkout the pull request
        if: steps.gate.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          fetch-depth: 0

      # Everything the review reads, written by job shell where no permission
      # system stands: the pull request itself, the diff against the merge
      # base, and the CI state of the head commit.
      - name: Collect the pull request for the review
        if: steps.gate.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/review"
          mkdir -p "$dir"
          git fetch origin "$BASE_BRANCH"
          base="$(git merge-base FETCH_HEAD HEAD)"
          gh pr view "$PR" --repo "$REPO" \
            --json number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles \
            --template '# {{.title}} (#{{.number}})

          author: {{.author.login}} · base: {{.baseRefName}} · head: {{.headRefName}} · +{{.additions}} −{{.deletions}} in {{.changedFiles}} files

          {{.body}}
          ' > "$dir/pr.md"
          {
            echo "# Commits (oldest first)"
            git log --reverse --format='- %h %s' "$base..HEAD"
          } > "$dir/commits.md"
          git diff --stat "$base" HEAD > "$dir/diffstat.txt"
          git diff --name-status "$base" HEAD > "$dir/files.txt"
          git diff "$base" HEAD > "$dir/diff.patch"
          # Non-zero when a check is failing or pending; the table is what matters.
          gh pr checks "$PR" --repo "$REPO" > "$dir/checks.txt" 2>&1 || true
          echo "Collected $(wc -l < "$dir/diff.patch") lines of diff against $BASE_BRANCH ($base) into $dir:"
          ls -l "$dir"

      - name: Review
        id: review
        if: steps.gate.outputs.review == 'true'
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          # Identifiers, not secrets: the federation rule's subject pattern is
          # what restricts who may exchange a token.
          anthropic_federation_rule_id: fdrl_01Sf3P3B65XKxK66EWBeNrxh
          anthropic_organization_id: c419af23-49f3-48ec-b346-a345f64ee5ec
          anthropic_service_account_id: svac_01So6woBVPFG4GmNRJT2QKVz
          # The federation rule spans every workspace, so one must be named.
          anthropic_workspace_id: wrkspc_01FrtuNtJAYdwk63f9DRj7UY

          # A tracking comment on every trigger; the summary is written into it.
          track_progress: true

          prompt: |
            Review pull request #${{ github.event.issue.number || github.event.pull_request.number }} of ${{ github.repository }}.

            Everything you need is already on disk under `${{ runner.temp }}/review/`; do not fetch any of it again:

            - `pr.md`: title, author, branches and the description.
            - `commits.md`: the commits, oldest first.
            - `diffstat.txt` and `files.txt`: what changed. Read these first.
            - `diff.patch`: the whole diff against the merge base. Read it in slices or Grep it.
            - `checks.txt`: the CI state of the head commit. Factor a failure in; do not repeat what CI says.

            The pull request's branch is checked out in the working directory. `CLAUDE.md` and `SPEC.md` are the project's own rules and the standard to review against: prefer a finding that cites one of them over a generic one.

            Review for, in this order:

            1. Correctness: logic errors, edge cases, and the invariants in CLAUDE.md (cache and workers, the repository is not the user's file, the layout rules).
            2. The lint policy: a new panic path, bare index, `as` cast or unchecked arithmetic outside tests; an `#[allow]` without its one-line reason.
            3. Security: untrusted input (payload, git output, config strings) reaching a path, a command or a rendered row; a token or a path in a log.
            4. The warm-tick budget: new work on the render path, allocation in a loop, a settings read outside `Ctx::settings()`, a process on a warm tick.
            5. Tests: each behaviour change covered (a unit test per bug, a golden or integration test for anything user-visible); a test weakened or removed.
            6. Documents and generated files: a schema change carries regenerated `docs/`, `examples/` and `tests/golden/`; `SPEC.md`, `PLAN.md` and `README.md` follow the change.

            Post each specific finding as an inline comment on the line it concerns, then finish the tracking comment with the summary: one line per finding, blocking ones first, nits last, and what you could not check. Write tersely: lead with the finding, then only the evidence needed to act on it, under 120 words a comment, a `suggestion` block over prose. Never post praise alone.

            Do not run `cargo`, `make` or the tests: CI does, and a build here costs minutes for nothing. You have no subagents; review the diff yourself. When the turn budget runs low, fold the remaining findings into the summary rather than posting them one by one, and never end without the summary.

          # `claude_args` is a block scalar: every line reaches the CLI verbatim,
          # so notes go here, not inside it. Sonnet 5 at high effort keeps a
          # 100-turn ceiling in the price range of a short Opus run. `Task` is
          # deliberately absent: a delegate the parent stops waiting for is how
          # six reviews posted nothing, and no prompt rule prevented it. The
          # file tools, `Bash` whole and the GitHub MCP tools are allowed: the
          # job holds `contents: read`, the checkout is disposable, and an
          # allowlist of verbs refused compound commands whatever it carried.
          claude_args: |
            --model claude-sonnet-5
            --effort high
            --max-turns 100
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob,LS,TodoWrite,mcp__github_inline_comment,mcp__github_inline_comment__create_inline_comment,mcp__github_comment,mcp__github_comment__update_claude_comment,mcp__github_ci,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,mcp__github"

      # The action reports success whenever Claude returned a result, so a
      # review that posted nothing, or spent its turns being refused, went
      # green. This reads the execution file the action writes and makes both
      # red, with the reason in the job summary. It runs the base branch's copy
      # of the script, because the checkout is the untrusted head and this
      # step holds the job's token.
      - name: Report what the review was refused
        if: always() && steps.gate.outputs.review == 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          # The action skips itself, writing no execution file, when this
          # workflow file differs from the default branch's copy (a pull
          # request that edits it) or when it failed before Claude started;
          # neither is a refused review.
          if [ -z "${EXECUTION_FILE:-}" ]; then
            echo "The action wrote no execution file, so there was no review to report on (it skips itself on a pull request that edits this workflow)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          script="$RUNNER_TEMP/review-denials.sh"
          git fetch --depth 1 origin "$BASE_BRANCH"
          if ! git show "FETCH_HEAD:scripts/review-denials.sh" > "$script"; then
            echo "No scripts/review-denials.sh on $BASE_BRANCH yet; nothing to report." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          chmod +x "$script"
          "$script" "${EXECUTION_FILE:-}" | tee -a "$GITHUB_STEP_SUMMARY"
