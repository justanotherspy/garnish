name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every action is pinned to a full commit SHA (Renovate keeps the pins and the
# version comments current).
jobs:
  # The same gate as `scripts/ci.sh` locally: fmt, strict clippy, nextest,
  # doctests, rustdoc with -D warnings, docs/ and examples/ sync.
  linux:
    name: linux (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same prerequisites as every other host: the toolchain pinned in
      # rust-toolchain.toml and cargo-nextest (SESSION_HOST=ci picks the
      # prebuilt binary).
      - run: ./scripts/setup.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/ci.sh 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      # Failures become check-run annotations readable through the API.
      - if: failure()
        run: ./scripts/ci-annotate.sh ci.log

  # macOS code paths (cache root, managed settings, age-only locks) have no
  # other coverage; see PLAN.md Phase 9.
  macos:
    name: macos (nightly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/setup.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make check 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - if: failure()
        run: ./scripts/ci-annotate.sh ci.log

  # Latency numbers on shared runners are not comparable to the budget in
  # SPEC § 8, so this never gates; run it by hand and read the artifact.
  bench:
    name: bench (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/setup.sh --bench
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./bench/run.sh
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/results/*.json
