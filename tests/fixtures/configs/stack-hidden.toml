[[row.col.row]]
modules = ["cost", "vim"]
[[row.col.row]]
modules = ["clock"]
[[row.col]]
[[row.col.row]]
modules = ["cost"]

[[row]]
modules = ["cost", "vim"]

[[row]]
modules = ["session"]
right   = ["api"]
