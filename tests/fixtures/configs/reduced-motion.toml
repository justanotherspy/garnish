# fixture: subscription-full
# columns: 70
# now: 1738425601, 1738425603
# icons: unicode
# env: HOME=$ROOT/tests/fixtures/settings/reduced-motion
# The user settings under that HOME say `prefersReducedMotion = true` and
# the config leaves `animate` unset, so every animation is frozen at frame 0
# exactly as `animate = false` would freeze it (SPEC § 4.2): the spinner
# stays on `⠋`, the scrolling text module stays at offset 0 inside its box
# and the over-wide first line is cut with `…`, while the clock keeps
# ticking. `reduced-motion-explicit` sets `animate = true` under the same
# settings and moves.

overflow = "ticker"

[[line]]
modules = ["model", "effort", "context", "session", "api", "cache"]
right   = ["clock"]

[[line]]
modules = ["text.motd"]

[modules.text.motd]
text     = "ship it before lunch, then write the docs"
width    = 12
overflow = "scroll-wrap"
