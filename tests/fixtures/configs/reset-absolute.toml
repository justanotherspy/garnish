# fixture: spend-limit
# columns: 100
# now: 1738425600, 1738429200
# icons: unicode
# `reset = "absolute"` prints the wall-clock time a window resets at in the
# clock's zone (UTC here), `both` the countdown with the time in
# parentheses, `countdown` (the default) the countdown alone (SPEC § 3.3).
# Only `limit7d` carries the weekday: its reset is days away, while the
# five-hour and spend windows keep a steady width. Rendered at two instants
# an hour apart: the countdowns move, the absolute times do not.

[frame]
style = "none"
fill  = false

[[line]]
modules = ["limit5h", "limit7d", "spend"]

[modules.limit5h]
reset = "absolute"

[modules.limit7d]
reset = "both"

[modules.spend]
reset = "absolute"
