# fixture: subscription-full
# columns: 60
# icons: unicode
# A box too narrow to draw (the rounded box needs two cells, one for each
# side) renders nothing and adds no lines to its row (SPEC § 4.3), so each
# row here is one line between the frame's caps. Its cells are empty cells,
# rule on a one-line row, and as the last column it does not end the row in
# content, so the rule runs into the cap. It kept its two edge lines, which
# under a frame with caps were two empty framed lines per row, and a
# one-line row's gaps turned to spaces: `❖ Opus ───   ─── ⏱ 1h12m`.
#
# Row 1: a one-cell boxed column. Row 2: a zero-width one between two
# columns, which takes no gap either: the row is the row without it. Row 3:
# a one-cell column holding a stack with a boxed row. Row 4: row 2 with a
# `style = "none"` box, which has no glyphs and so fits in one cell, but a
# zero-width column has none: it made its row three lines tall.

[box.x]
style = "none"

[[row]]
[[row.col]]
modules = ["model"]
[[row.col]]
width = 1
box = true
modules = ["clock"]

[[row]]
gap = 3
[[row.col]]
modules = ["model"]
[[row.col]]
width = 0
box = true
modules = ["clock"]
[[row.col]]
modules = ["session"]

[[row]]
[[row.col]]
modules = ["model"]
[[row.col]]
width = 1
[[row.col.row]]
box = true
modules = ["clock"]

[[row]]
gap = 3
[[row.col]]
modules = ["model"]
[[row.col]]
width = 0
box = "x"
modules = ["clock"]
[[row.col]]
modules = ["session"]
