# fixture: subscription-full
# columns: 70
# now: 1738425601, 1738425603
# icons: unicode
# env: HOME=$ROOT/tests/fixtures/settings/reduced-motion
# The same user settings as `reduced-motion` (`prefersReducedMotion = true`)
# with `animate = true` written in the config: an explicit key wins over
# the setting (SPEC § 4.2), so the spinner turns, the text scrolls and the
# over-wide first line is a ticker window.

animate  = true
overflow = "ticker"

[[line]]
modules = ["model", "effort", "context", "session", "api", "cache"]
right   = ["clock"]

[[line]]
modules = ["text.motd"]

[modules.text.motd]
text     = "ship it before lunch, then write the docs"
width    = 12
overflow = "scroll-wrap"
