# Without a frame a spacer is spaces only and, with colour off as here,
# Claude Code drops the row; `blank = true` gives it one invisible cell (the
# braille blank U+2800) so the row stays. The second spacer keeps the
# default and stays whitespace (SPEC § 4.1, decided 2026-09-06).
[frame]
style = "none"
[[line]]
modules = []
blank = true
[[line]]
modules = ["model", "context"]
[[line]]
modules = []
