# name: tall-eight-lines
# summary: one module per row, eight rows, square frame
# columns: 100
# needs: nerd-font

preset = "full"
icons  = "nerd"
theme  = "garnish"
color  = "auto"
align  = true
durations = "fixed"
truncate = true

[frame]
style = "square"

[[row]]
modules = ["path"]
right   = ["clock"]
[[row]]
modules = ["branch"]
[[row]]
modules = ["sync"]
[[row]]
modules = ["pr"]
right   = ["session_name"]
[[row]]
modules = ["model"]
[[row]]
modules = ["context"]
right   = ["limit5h"]
[[row]]
modules = ["session"]
[[row]]
modules = ["cache"]
right   = ["lines"]
