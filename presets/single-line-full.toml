# name: single-line-full
# summary: everything on one row; wider than the terminal it scrolls as a ticker
# columns: 200
# needs: nerd-font

# Wider than most terminals: instead of a cut, the left group scrolls one
# cell per second and wraps around (SPEC § 4.1 `overflow = "ticker"`); the
# clock and the other right-hand modules stay put.

preset = "full"
icons  = "nerd"
theme  = "garnish"
color  = "auto"
align  = true
durations = "fixed"
overflow  = "ticker"

[frame]
style = "rounded"

[[line]]
modules = ["path", "branch", "sync", "worktree", "pr", "model", "effort", "context", "style", "limit5h", "limit7d", "spend", "cost", "session", "api", "cache"]
right   = ["session_name", "agent", "vim", "lines", "clock"]
